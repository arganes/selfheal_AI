<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Self Healing AI Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        pre {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .healthy {
            color: green;
            font-weight: bold;
        }

        .warning {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Self Healing AI</h1>
    <div class="subtitle">
        Real-time system monitoring and self-healing dashboard
    </div>

    <div class="cards">

        <div class="card">
            <h3>CPU Usage</h3>
            <div class="value" id="cpu">Loading...</div>
        </div>

        <div class="card">
            <h3>Memory Usage</h3>
            <div class="value" id="memory">Loading...</div>
        </div>

        <div class="card">
            <h3>Total Events</h3>
            <div class="value" id="events">Loading...</div>
        </div>

    </div>

    <div class="section">
        <h2>System Status</h2>
        <div id="system-status">Loading...</div>
    </div>

    <div class="section">
        <h2>Latest Event</h2>
        <pre id="latest">Loading...</pre>
    </div>

    <div class="section">
        <h2>Recent Events</h2>
        <pre id="history">Loading...</pre>
    </div>

    <script>

        async function loadDashboard() {

            try {

                const response = await fetch("/dashboard");
                const data = await response.json();

                const cpu =
                    data.current_status.cpu_usage_percent;

                const memory =
                    data.current_status.memory_usage_percent;

                document.getElementById("cpu").textContent =
                    cpu + "%";

                document.getElementById("memory").textContent =
                    memory + "%";

                document.getElementById("events").textContent =
                    data.total_events;

                const statusElement =
                    document.getElementById("system-status");

                if (cpu >= 80 || memory >= 80) {

                    statusElement.textContent =
                        "⚠ System requires attention";

                    statusElement.className = "warning";

                } else {

                    statusElement.textContent =
                        "✓ System is healthy";

                    statusElement.className = "healthy";
                }

                document.getElementById("latest").textContent =
                    JSON.stringify(
                        data.latest_event,
                        null,
                        2
                    );

                document.getElementById("history").textContent =
                    JSON.stringify(
                        data.recent_events,
                        null,
                        2
                    );

            } catch (error) {

                document.getElementById("system-status").textContent =
                    "Unable to connect to backend";

            }
        }

        loadDashboard();

        setInterval(loadDashboard, 5000);

    </script>

</body>
</html>
